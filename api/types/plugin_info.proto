syntax = "proto3";

package containerd.types;

import "types/platform.proto";

option go_package = "github.com/containerd/containerd/api/types;types";

// PluginInfo describes a plugin served by a shim. A managed proxy plugin shim
// attaches it to the BootstrapResult it returns at startup, so containerd can
// register the plugin with the exports, capabilities and platforms the shim
// reports rather than requiring them all to be set in configuration.
//
// containerd ignores a bootstrap extension whose type it does not recognize, so
// a shim may attach this unconditionally; an older daemon keeps its previous
// behavior.
message PluginInfo {
  // Exports are arbitrary key/value metadata surfaced through the plugin's
  // introspection Meta.Exports. The reserved key "address" is set by containerd
  // to the shim's listening address and must not be overridden here.
  map<string, string> exports = 1;

  // Capabilities are the plugin capability strings surfaced through the
  // plugin's introspection Meta.Capabilities.
  repeated string capabilities = 2;

  // Platforms are the platforms the plugin supports, surfaced through the
  // plugin's introspection Meta.Platforms.
  repeated Platform platforms = 3;
}
