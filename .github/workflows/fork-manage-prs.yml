name: Manage Fork PR List

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        options:
          - add
          - remove
      repo:
        description: "Owner/repo (e.g. containerd/containerd)"
        required: true
        default: "containerd/containerd"
        type: string
      pr_number:
        description: "PR number or branch name"
        required: true
        type: string
      title:
        description: "Title (optional for add; auto-fetched for PRs if omitted, not fetched for branches)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  manage-pr-list:
    name: "${{ inputs.action }} PR/branch"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: main-fork

      - name: Validate inputs
        run: |
          if ! echo "${{ inputs.pr_number }}" | grep -qE '^[0-9]+$|^[a-zA-Z][a-zA-Z0-9._/-]*$'; then
            echo "::error::pr_number must be a numeric PR number or a valid branch name (e.g. 1234 or my-feature/branch)"
            exit 1
          fi

      - name: Add PR or branch to list
        if: inputs.action == 'add'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ inputs.repo }}"
          PR="${{ inputs.pr_number }}"

          if grep -qE "^${REPO} ${PR}( |$)" contrib/pr-list; then
            echo "::error::${REPO} ${PR} already exists in contrib/pr-list"
            exit 1
          fi

          TITLE="${{ inputs.title }}"
          # Auto-fetch title only for numeric PR numbers; branches have no PR to query.
          if [ -z "${TITLE}" ] && echo "${PR}" | grep -qE '^[0-9]+$'; then
            TITLE=$(gh pr view "${PR}" --repo "${REPO}" --json title -q .title)
          fi

          if [ -n "${TITLE}" ]; then
            echo "${REPO} ${PR} ${TITLE}" >> contrib/pr-list
          else
            echo "${REPO} ${PR}" >> contrib/pr-list
          fi

      - name: Remove PR or branch from list
        if: inputs.action == 'remove'
        run: |
          REPO="${{ inputs.repo }}"
          PR="${{ inputs.pr_number }}"

          if ! grep -qE "^${REPO} ${PR}( |$)" contrib/pr-list; then
            echo "::error::${REPO} ${PR} not found in contrib/pr-list"
            exit 1
          fi

          sed -i -E "\|^${REPO} ${PR}( |$)|d" contrib/pr-list

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ inputs.pr_number }}"
          if echo "${PR}" | grep -qE '^[0-9]+$'; then
            IDENTIFIER="${{ inputs.repo }}#${PR}"
          else
            IDENTIFIER="${{ inputs.repo }}:${PR}"
          fi

          # Use the GitHub Contents API so the commit is signed (verified) by
          # GitHub, satisfying branch-protection rules that require signed commits.
          CONTENT=$(base64 -w0 < contrib/pr-list)
          SHA=$(gh api repos/${{ github.repository }}/contents/contrib/pr-list \
            --jq '.sha')
          gh api repos/${{ github.repository }}/contents/contrib/pr-list \
            --method PUT \
            --field message="contrib/pr-list: ${{ inputs.action }} ${IDENTIFIER}" \
            --field content="${CONTENT}" \
            --field sha="${SHA}" \
            --field branch="main-fork"

      - name: Trigger merge workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fork-merge.yml --ref main-fork --repo ${{ github.repository }}
